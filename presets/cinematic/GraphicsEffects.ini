; Modern WoW Renderer - PRESET: CINEMATIC
; Maximum visual quality. ULTRA atmosphere resolution, thicker god rays,
; strong reflections, deeper/softer native shadows, local light glow near
; torches/fires via DynamicLighting (legacy screen-space glow is off). Costs the most GPU time of the three load presets.
; Complete live settings for the current renderer; diagnostics and AI Materials off.

