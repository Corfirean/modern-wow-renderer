; Modern WoW Renderer - PRESET: BALANCED - FOGGY / ATMOSPHERIC
; Style variant on top of Balanced: leans into mist and god rays. Denser
; ground mist and haze, visibility drops off sooner, rays reach further,
; shadows read softer and lighter since thick air scatters harsh contrast.
; Complete live settings for the current renderer; diagnostics and AI Materials off.

