; Modern WoW Renderer - PRESET: BALANCED - VIVID
; Style variant on top of Balanced: punchy, saturated, high-contrast look.
; Stronger god rays and sun glint, crisper (less soft) but darker shadows,
; more aggressive sharpening.
; Complete live settings for the current renderer; diagnostics and AI Materials off.

