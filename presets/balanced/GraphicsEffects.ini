; Modern WoW Renderer - PRESET: BALANCED
; The default, all-round tuning. Volumetric atmosphere on HIGH quality,
; reflective water, moderately softened native shadows. Good middle ground
; between look and framerate. Everything here is adjustable live via F7.
; Complete live settings for the current renderer; diagnostics and AI Materials off.

